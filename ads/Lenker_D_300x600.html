<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=300, initial-scale=1.0">
<meta name="ad.size" content="width=300,height=600">
<title>Lenker D 300x600</title>
<style>
html,body{margin:0;padding:0;width:300px;height:600px;overflow:hidden;background:#122e49;}
body{font-family:Inter, Arial, Helvetica, sans-serif;}
*{box-sizing:border-box;}
a.ad{position:relative;display:block;width:300px;height:600px;overflow:hidden;color:#fff;text-decoration:none;background:#122e49;}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:64% 36%;transform:scale(1.02);animation:bgFloat 10s ease-in-out infinite alternate;}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,30,46,.02) 0%, rgba(15,30,46,.12) 42%, rgba(18,46,73,.92) 100%), linear-gradient(90deg, rgba(18,46,73,.38) 0%, rgba(18,46,73,.16) 42%, rgba(18,46,73,0) 100%);}
.content{position:absolute;left:24px;right:24px;bottom:24px;display:flex;flex-direction:column;align-items:flex-start;gap:11px;z-index:2;max-width:76%;}
.logo{position:absolute;left:24px;top:24px;z-index:2;font-size:15px;font-weight:700;letter-spacing:4.80px;line-height:1;color:#fff;}
.headline{font-size:28px;line-height:0.94;font-weight:700;letter-spacing:-0.03em;color:#fff;}
.headline .accent{color:#d5eb3c;}
.subhead{font-size:10.5px;line-height:1.18;font-weight:400;color:rgba(255,255,255,.95);max-width:100%;}
.cta{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;background:#d5eb3c;color:#10263c;border-radius:4px;font-size:9.5px;font-weight:700;line-height:1;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.12);}
.click{position:absolute;inset:0;z-index:3;}
.legal{display:none;}
@keyframes bgFloat{0%{transform:scale(1.02) translate3d(0,0,0);}100%{transform:scale(1.07) translate3d(0,-1.5%,0);}}
</style>
<script>
function getExitUrl(){
  if (window.clickTag) return window.clickTag;
  const params = new URLSearchParams(window.location.search);
  return params.get('clickTag') || 'https://www.lenker.com/';
}
function handleClick(e){
  e.preventDefault();
  window.open(getExitUrl(), '_blank');
}
</script>
</head>
<body>
<a class="ad" href="#" onclick="handleClick(event)">
  <img class="bg" src="../assets/D.png" alt="">
  <div class="overlay"></div>
  <div class="logo">LENKER</div>
  <div class="content">
    <div class="headline">No <span class="accent">wasted</span><br>impressions.</div>
    <div class="subhead">Not on you, and not<br>on your customers.</div>
    <div class="cta">See how</div>
  </div>
</a>
</body>
</html>
